name: Update GitHub Data Cache

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub data and update cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: night-slayer18
          GITHUB_ORG: OpenSyntaxHQ
        run: |
          set -e

          echo "Processing data with Python..."
          python3 << 'PYEOF'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          github_username = os.environ.get('GITHUB_USERNAME', 'night-slayer18')
          github_org = os.environ.get('GITHUB_ORG', 'OpenSyntaxHQ')
          token = os.environ.get('GITHUB_TOKEN', '')

          headers = {'User-Agent': 'Portfolio-Cache-Updater'}
          if token:
              headers['Authorization'] = f"token {token}"

          def gh_get(endpoint):
              cmd = ['curl', '-s']
              if token:
                  cmd += ['-H', f"Authorization: token {token}"]
              cmd += ['-H', 'User-Agent: Portfolio-Cache-Updater', f"https://api.github.com/{endpoint}"]
              res = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  return json.loads(res.stdout)
              except Exception:
                  return None

          profile = gh_get(f"users/{github_username}") or {}
          user_repos = gh_get(f"users/{github_username}/repos?per_page=100&sort=updated") or []
          org_repos = gh_get(f"orgs/{github_org}/repos?per_page=100&sort=updated") or []

          if not isinstance(user_repos, list): user_repos = []
          if not isinstance(org_repos, list): org_repos = []

          # Tag origin
          for r in user_repos:
              r['_source'] = 'night-slayer18'
          for r in org_repos:
              r['_source'] = 'OpenSyntaxHQ'
              r['isOpenSyntax'] = True

          all_repos = user_repos + org_repos

          lang_colors = {
              'TypeScript': '#3178c6', 'JavaScript': '#f1e05a',
              'Go': '#00add8', 'Python': '#3572A5', 'Java': '#b07219',
              'Shell': '#89e051', 'Rust': '#dea584', 'C': '#555555',
              'C++': '#f34b7d', 'Ruby': '#701516', 'HTML': '#e34c26',
              'CSS': '#563d7c', 'Vue': '#41b883', 'Swift': '#ffac45',
              'Kotlin': '#7F52FF', 'PLpgSQL': '#336791', 'SQL': '#336791'
          }

          lang_count = {}
          total_stars = 0
          total_forks = 0

          for repo in all_repos:
              if not repo.get('fork', False):
                  lang = repo.get('language')
                  if lang:
                      lang_count[lang] = lang_count.get(lang, 0) + 1
                  total_stars += repo.get('stargazers_count', 0)
                  total_forks += repo.get('forks_count', 0)

          top_languages = [
              {'name': lang, 'count': count, 'color': lang_colors.get(lang, '#666')}
              for lang, count in sorted(lang_count.items(), key=lambda x: -x[1])[:6]
          ]

          # Select top repos
          eligible = [r for r in all_repos if not r.get('fork') and r.get('description') and not r.get('name', '').startswith('.')]
          eligible.sort(key=lambda r: (-r.get('stargazers_count', 0), -len(r.get('topics', []))))

          featured_repos = []
          seen_names = set()
          for repo in eligible:
              name = repo.get('name')
              if name in seen_names: continue
              seen_names.add(name)
              is_opensyntax = repo.get('_source') == 'OpenSyntaxHQ' or 'opensyntax' in repo.get('topics', [])
              featured_repos.append({
                  'name': name,
                  'full_name': repo.get('full_name', f"{github_username}/{name}"),
                  'org': repo.get('_source', github_username),
                  'description': repo.get('description', ''),
                  'html_url': repo.get('html_url', f"https://github.com/{repo.get('full_name')}"),
                  'homepage': repo.get('homepage') or '',
                  'stargazers_count': repo.get('stargazers_count', 0),
                  'forks_count': repo.get('forks_count', 0),
                  'language': repo.get('language') or '',
                  'topics': (repo.get('topics') or [])[:5],
                  'updated_at': repo.get('updated_at', ''),
                  'featured': repo.get('stargazers_count', 0) >= 5 or name == 'tweak',
                  'isOpenSyntax': is_opensyntax
              })

          # Read existing cache to preserve streak
          existing_streak = 274
          existing_contributions = 1420
          cache_file = 'data/github-cache.json'
          if os.path.exists(cache_file):
              try:
                  with open(cache_file) as f:
                      old_data = json.load(f)
                      existing_streak = old_data.get('stats', {}).get('contribution_streak', 274)
                      existing_contributions = old_data.get('stats', {}).get('total_contributions', 1420)
              except Exception:
                  pass

          cache_data = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'profile': {
                  'login': profile.get('login', github_username),
                  'name': profile.get('name', 'Samanuai A'),
                  'avatar_url': profile.get('avatar_url', f"https://avatars.githubusercontent.com/u/83979018?v=4"),
                  'bio': profile.get('bio', 'Founder @OpenSyntaxHQ'),
                  'company': 'Founder @OpenSyntaxHQ',
                  'location': profile.get('location', 'Kochi, Kerala 🇮🇳'),
                  'public_repos': len([r for r in all_repos if not r.get('fork')]),
                  'followers': profile.get('followers', 30),
                  'following': profile.get('following', 21),
                  'created_at': profile.get('created_at', '2021-05-10T18:14:03Z')
              },
              'stats': {
                  'total_stars': total_stars,
                  'total_forks': total_forks,
                  'total_repos': len(all_repos),
                  'top_languages': top_languages,
                  'contribution_streak': existing_streak,
                  'total_contributions': existing_contributions
              },
              'featured_repos': featured_repos[:12]
          }

          os.makedirs('data', exist_ok=True)
          with open(cache_file, 'w') as f:
              json.dump(cache_data, f, indent=2)

          print(f"Cache updated successfully with {len(all_repos)} repos from {github_username} and {github_org}!")
          PYEOF

      - name: Commit and push changes
        run: |
          git config --local user.email "samanuaia257@gmail.com"
          git config --local user.name "night-slayer18"
          git add data/github-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -s -m "chore(data): auto-update GitHub stats cache [skip ci]"
            git push
          fi
