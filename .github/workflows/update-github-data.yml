name: Update GitHub Data Cache

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cache update script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: night-slayer18
          GITHUB_ORG: OpenSyntaxHQ
        run: python3 scripts/update_cache.py

      - name: Commit and push changes
        run: |
          git config --local user.email "samanuaia257@gmail.com"
          git config --local user.name "night-slayer18"
          git add data/github-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -s -m "chore(data): auto-update GitHub stats cache [skip ci]"
            git push
          fi
